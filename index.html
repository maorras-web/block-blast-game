<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Block Blast - משחק חשיבה</title>
    <!-- Google Fonts לעיצוב טיפוגרפי נקי ומודרני -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- כותרת ולוח ניקוד -->
        <header class="header">
            <div class="score-box">
                <span class="label">ניקוד</span>
                <span id="score" class="value">0</span>
            </div>
            
            <div class="title-container">
                <h1 class="game-title">BLOCK<br>BLAST</h1>
            </div>

            <div class="score-box">
                <span class="label">שיא</span>
                <span id="high-score" class="value">0</span>
            </div>
        </header>

        <!-- לוח המשחק 8x8 -->
        <main>
            <div id="board-wrapper">
                <div id="board"></div>
            </div>
        </main>

        <!-- אזור הצורות לגרירה -->
        <section class="shapes-wrapper">
            <div id="shapes-container"></div>
        </section>

        <!-- כפתור איפוס -->
        <footer class="footer">
            <button id="restart-btn" type="button">
                <span>משחק חדש</span>
            </button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
